[backdrop]
enabled = true

[bar.default]
background_opacity = 0.4999999888241291
center = [ "workspaces" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "clock",
    "session"
]
layer = "overlay"
margin_ends = 0
start = [ "launcher", "wallpaper" ]

[control_center]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000001",
    "desktop-widget-0000000000000002",
    "desktop-widget-0000000000000003",
    "desktop-widget-0000000000000004"
]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 128.0
    box_width = 224.0
    cx = 1088.0
    cy = 672.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1104.0
    cy = 798.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1386.0
    cy = 714.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 0.0
    box_width = 0.0
    cx = 1373.0
    cy = 432.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

[dock]
background_opacity = 0.4999999888241291
enabled = true
icon_size = 16
launcher_custom_image = "/home/princedimond/Pictures/オタク　Productions/favicon.png"
launcher_position = "start"
pinned = [ "thunar", "com.mitchellh.ghostty", "zen-beta", "anytype", "ferdium" ]
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
niri_overview_type_to_launch_enabled = true

    [shell.animation]
    speed = 1.0500000156462193

    [shell.launcher]
    session_search = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/princedimond/Pictures/Screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Hexa34C"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
fill_mode = "fit"

    [wallpaper.default]
    path = "color:#000000"

    [wallpaper.last]
    path = "color:#000000"

    [wallpaper.monitors.eDP-1]
    path = "color:#000000"
